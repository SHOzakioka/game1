version: '3'
name: game1

services:
  web:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      retries: 3
